variables:
  github_owner: zloeber
  github_repo: terraform-ingest

providers:
  github:
    kind: github
    auth:
      kind: token
      config:
        # Fine-grained PAT with Actions secrets + Environments write (not PAT_TOKEN itself).
        token: ${GITHUB_TOKEN}

secrets:
  # GitHub PAT for semantic-release tag push and gh-release in the production environment.
  # Consumed by .github/workflows/semantic-release.yaml as secrets.PAT_TOKEN.
  - name: pat_token
    kind: static
    config:
      default: ${PAT_TOKEN}
    targets:
      - provider: github
        kind: github_secret
        config:
          owner: ${github_owner}
          repo: ${github_repo}
          environment: production
          secret_name: PAT_TOKEN
      - provider: local
        kind: file
        config:
          path: .env
          format: dotenv
          merge: true
          key: PAT_TOKEN
    process_tags:
      - cicd
      - semantic_release

metadata:
  project: terraform-ingest
  owner: zloeber
  environments:
    - production
